:root{--bg:#091113;--panel:rgba(10,18,19,.9);--line:#c8d2c51f;--text:#e8ece4;--muted:#8b9890;--gold:#d1ad6b;--green:#8eaf78}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}.map{position:fixed;inset:0}.map canvas{display:block;width:100%;height:100%}.topbar{position:fixed;z-index:4;inset:0 0 auto;height:82px;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#081012f2,transparent)}.brand{display:flex;align-items:center;gap:11px}.mark{font-size:23px;color:var(--gold)}.brand strong{display:block;letter-spacing:3px;font-size:13px}.brand small,.eyebrow,.mono{font:9px 'DM Mono';letter-spacing:1px;color:var(--muted)}.brand small{display:block;margin-top:5px}.search{width:min(390px,42vw);height:40px;border:1px solid var(--line);background:#0d1718d9;display:flex;align-items:center;padding:0 12px;gap:9px}.search input{width:100%;border:0;outline:0;background:none;color:var(--text);font:12px Manrope}.search input::placeholder{color:#708078}.actions{display:flex;gap:8px}.button{border:1px solid var(--line);background:#142021d9;color:#c2cbc1;height:36px;padding:0 12px;cursor:pointer;font:10px 'DM Mono'}.button:hover,.button.active{border-color:#d1ad6b77;color:var(--gold)}.rail,.panel,.detail,.route-panel,.heat-panel{position:fixed;z-index:3;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 55px #0006;backdrop-filter:blur(12px)}.rail{left:25px;top:108px;width:182px;padding:17px}.rail .eyebrow{margin-bottom:12px}.layer{width:100%;display:flex;align-items:center;gap:9px;padding:10px 0;border:0;background:none;color:#aeb8ad;text-align:left;cursor:pointer;font-size:12px}.layer.active{color:var(--text)}.layer i{width:7px;height:7px;border-radius:50%;background:#71817a}.layer.active i{background:var(--gold);box-shadow:0 0 10px var(--gold)}.layer b{margin-left:auto;color:#6e7b73;font:9px ' g:15px}.route-panel select{width:100%;margin-top:8px}.route-row{display:flex;align-items:center;gap:9px;margin:8px 0}.route-row span{width:7px;height:7px;border-radius:50%;background:#89b47b}.route-row:last-of-type span{background:#d47c6b}.route-row select{margin:0;flex:1}.heat-panel{right:26px;bottom:27px;width:245px;padding:14px}.heat-panel button{float:right;background:none;border:0;color:var(--gold);cursor:pointer;font:9px 'DM Mono'}.bar{margin-top:11px}.bar label{display:flex;justify-content:space-between;color:#9eaba1;font:9px 'DM Mono'}.bar i{display:block;height:4px;background:#293735;margin-top:4px}.bar i b{display:block;height:100%;background:var(--gold)}.tip{position:fixed;z-index:8;pointer-events:none;min-width:190px;padding:11px;background:#0b1516f5;border:1px solid #d1ad6b66;box-shadow:0 12px 35px #0008}.tip strong{display:block;font-size:12px;margin:4px 0}.tip small{color:#89968c;font:9px 'DM Mono'}.tip em{display:block;color:#aeb8ae;font-size:10px;font-style:normal;margin-top:7px;line-height:1.45}.status{position:fixed;right:27px;top:91px;z-index:3;color:var(--gold);font:9px 'DM Mono'}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:7px}.hint{position:fixed;right:27px;bottom:28px;color:#829087;font:9px 'DM Mono';z-index:2}.route-line{position:fixed;left:50%;top:50%;z-index:3;color:var(--gold);background:#0b1516cc;padding:9px 12px;border:1px solid #d1ad6b44;font:10px 'DM Mono';transform:translate(-50%,-50%);pointer-events:none}.hidden{display:none}@media(max-width:800px){.rail{display:none}.topbar{padding:14px}.search{width:43%}.detail{right:12px;top:90px;width:285px}.panel{left:12px;bottom:12px;width:calc(100vw - 24px)}.route-panel{right:12px;top:auto;bottom:190px;width:calc(100vw - 24px)}.heat-panel{right:12px;bottom:110px;width:calc(100vw - 24px)}.hint{display:none}}

<body><div id="app"><div class="map" id="map"></div><header class="topbar"><div class="brand"><span class="mark">✦</span><div><strong>SAINT MERIDIAN</strong><small>CITY ATLAS / LIVE CARTOGRAPHY</small></div></div><div class="search">⌕ <input id="search" placeholder="Search the city..." /></div><div class="actions"><button class="button" id="night">◐ NIGHT</button></div></header><aside class="rail"><div class="eyebrow">MAP LAYERS</div><button class="layer active" data-layer="city"><i/>City <b>ON</b></button><button class="layer active" data-layer="places"><i/>Businesses <b id="placeCount">0</b></button><button class="layer active" data-layer="nightlife"><i/>Nightlife <b id="nightCount">0</b></button><button class="layer active" data-layer="transport"><i/>Transport <b>42</b></button><div class="rule"/><div class="eyebrow">CITY STATUS</div><p class="mono">● LIVE MODEL 1.0</p><p class="mono">◌ CLEAR / 18°C</p></aside><section class="panel"><div class="eyebrow">DISCOVER / <span id="resultCount">0</span> PLACES</div><div class="chips" id="chips"></div><select class="select" id="district"><option value="ALL">All districts</option></select></section><aside class="detail" id="detail"></aside><section class="route-panel"><div class="eyebrow">NAVIGATION / LIVE ROUTE</div><div class="route-row"><span/> <select id="origin"><option value="">Choose starting point</option></select></div><div class="route-row"><span/> <select id="destination"><option value="">Choose destination</option></select></div><button class="route" id="draw">DRAW ROUTE ↗</button></section><section class="heat-panel"><button id="heatToggle">SHOW</button><div class="eyebrow">CARTOGRAPHY / DENSITY</div><strong>District heatmap</strong><div id="heatBars" class="hidden"></div></section><div id="tip" class="tip hidden"></div><div id="routeLabel" class="route-line hidden"></div><div class="status"><i/> SYSTEMS ONLINE</div><div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.177.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const districts=[['Cinder Wharf',-34,15,'#b87352'],['Northline Yards',-14,17,'#d49a5e'],['Morrow Point',10,17,'#d5b06e'],['Meridian Core',0,3,'#e0c98a'],['Vesper Row',19,2,'#bc6c62'],['The Narrows',-22,-2,'#8e9a7d'],['Saint Orison',4,-13,'#a7a58d'],['Bellweather Hills',28,-13,'#819a83'],['Pacific Verge',-28,-18,'#7193a2'],['Juniper Flats',8,-25,'#9a9679'],['Crown Terrace',30,-25,'#c4ae84'],['Redhaven',-26,31,'#a97659']].map(d=>({name:d[0],x:d[1],z:d[2],color:d[3]}));
const cats=['Food & Drink','Nightlife','Culture','Shopping','Stay','Services','Transport']; const colors=['#d5a66c','#b776bd','#c47c68','#c09b70','#80aebb','#9bb57e']; const names=['Blue Finch','Rainline','Salt & Coal','Mariner','Nightjar','Cedar House','Harbor Cup','Lowtide','Signal','Foundry','Nocturne','Meridian'];
const locations=[];for(let i=0;i<310;i++){const d=districts[(i*7+Math.floor(i/9))%districts.length],cat=cats[i%cats.length];locations.push({id:'loc-'+i,name:names[i%names.length]+' '+String(i+1).padStart(2,'0'),category:cat,district:d.name,x:d.x+((i*13)%17-8)*.72,z:d.z+((i*19)%15-7)*.7,rating:(4+((i*13)%10)/10).toFixed(1),accent:colors[i%colors.length],description:'A fictional '+cat.toLowerCase()+' stop with its own corner of Saint Meridian atmosphere.'});}
const categoryMap=new Map(cats.map(c=>[c,c]));let filtered=[...locations],selected=locations[0],night=false;const $=id=>document.getElementById(id);$('placeCount').textContent=locations.length;$('nightCount').textContent=locations.filter(x=>x.category==='Nightlife').length;
for(const d of districts){$('district').insertAdjacentHTML('beforeend',`<option value="${d.name}">${d.name}</option>`)}
for(const c of ['ALL',...cats]){const b=document.createElement('button');b.className='chip'+(c==='ALL'?' active':'');b.textContent=c;b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter(c,$('district').value)};$('chips').appendChild(b)}
function filter(cat='ALL',district='ALL'){const q=$('search').value.toLowerCase();filtered=locations.filter(x=>(cat==='ALL'||x.category===cat)&&(district==='ALL'||x.district===district)&&(!q||(`${x.name} ${x.category} ${x.district}`).toLowerCase().includes(q)));$('resultCount').textContent=filtered.length;renderMarkers();if(filtered[0])select(filtered[0])}
$('search').oninput=()=>filter(document.querySelector('.chip.active')?.textContent||'ALL',$('district').value);$('district').onchange=()=>filter(document.querySelector('.chip.active')?.textContent||'ALL',$('district').value);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b1113');scene.fog=new THREE.Fog('#0b1113',60,190);const city=new THREE.Group();scene.add(city);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.12});const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,145),mat('#202a28'));ground.rotation.x=-Math.PI/2;city.add(ground);const ocean=new THREE.Mesh(new THREE.PlaneGeometry(80,145),mat('#102a34'));ocean.rotation.x=-Math.PI/2;ocean.position.set(-78,-.08,0);city.add(ocean);
function road(x,z,w,d,r=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),mat('#171c1d'));m.position.set(x,.04,z);m.rotation.y=r;city.add(m)}for(let z=-43;z<44;z+=8)road(0,z,138,2);for(let x=-58;x<53;x+=8)road(x,0,2,90,Math.PI/2);road(-34,-1,3,90);road(-10,0,3,90);road(25,0,3,94,Math.PI/2);
const markerGroup=new THREE.Group();city.add(markerGroup);const markerObjects=[];for(const d of districts){const ring=new THREE.Mesh(new THREE.RingGeometry(5.7,6,40),new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:.13,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(d.x,.12,d.z);city.add(ring);for(let i=0;i<30;i++){const a=i*2.39,distance=2+(i%7)*1.2,w=1.1+(i%5)*.4,h=d.name==='Meridian Core'?4+(i%8)*1.5:1.2+(i%7)*.6,b=new THREE.Mesh(new THREE.BoxGeometry(w,h,1.1+(i%4)*.4),mat(['#5e6969','#73706a','#8a8175','#596b70'][i%4]));b.position.set(d.x+Math.cos(a)*distance,h/2,d.z+Math.sin(a)*distance);city.add(b)}}
const landmarks=[[-38,-21,5,'#dfc77b'],[35,-29,2,'#87b5c8'],[-15,20,3,'#c9a767'],[30,-16,4,'#d58b6d']];for(const [x,z,type,c] of landmarks){const o=new THREE.Mesh(type===5?new THREE.CylinderGeometry(.5,.7,5,10):new THREE.CylinderGeometry(1.5,2,3.5,6),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.12}));o.position.set(x,type===5?2.5:1.75,z);city.add(o)}
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;$('map').appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(42,1,.1,320);let target=new THREE.Vector3(0,0,0),distance=88,az=.72,el=.7;function cam(){camera.position.set(target.x+Math.cos(az)*Math.cos(el)*distance,target.y+Math.sin(el)*distance,target.z+Math.sin(az)*Math.cos(el)*distance);camera.lookAt(target)}cam();const ambient=new THREE.HemisphereLight('#a0b4b2','#17201f',1.2);scene.add(ambient);const sun=new THREE.DirectionalLight('#e1c08c',2.2);sun.position.set(-30,60,20);scene.add(sun);
function renderMarkers(){markerGroup.clear();markerObjects.length=0;for(const l of filtered){const p=new THREE.Group();p.position.set(l.x,.7,l.z);p.userData.location=l;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.8,6),new THREE.MeshBasicMaterial({color:l.accent}));stem.position.y=.35;p.add(stem);const dot=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),new THREE.MeshBasicMaterial({color:l.accent}));dot.position.y=.8;p.add(dot);markerGroup.add(p);markerObjects.push(p)}}
function select(l){selected=l;city.focus=l;cam();$('detail').innerHTML=`<div class="detail-head"><span class="type">${l.category.toUpperCase()}</span><button id="close">×</button></div><h1>${l.name}</h1><div class="rating">★ ${l.rating}<span class="open">● OPEN NOW</span></div><p>${l.description}</p><div class="info"><span>⌖</span><div><small>DISTRICT</small><strong>${l.district}</strong></div></div><div class="info"><span>◷</span><div><small>ADDRESS</small><strong>${l.district} Avenue ${Math.round(Math.abs(l.x*3+l.z))}</strong></div></div><button class="route" id="routeSelected">ROUTE TO THIS LOCATION ↗</button>`;$('close').onclick=()=>$('detail').innerHTML=''}
renderMarkers();filter();
let down=false,lx=0,ly=0;renderer.domElement.onpointerdown=e=>{down=true;lx=e.clientX;ly=e.clientY};window.onpointerup=()=>down=false;window.onpointermove=e=>{if(!down)return;az-=(e.clientX-lx)*.006;el=THREE.MathUtils.clamp(el+(e.clientY-ly)*.006,.22,1.3);lx=e.clientX;ly=e.clientY;cam()};renderer.domElement.onwheel=e=>{distance=THREE.MathUtils.clamp(distance+e.deltaY*.06,28,150);cam()};
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.onclick=e=>{const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(markerGroup.children,true).find(h=>h.object.parent?.userData.location||h.object.userData.location);const l=hit?.object.parent?.userData.location||hit?.object.userData.location;if(l)select(l)};renderer.domElement.onpointermove=e=>{if(down)return;const r=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(markerGroup.children,true).find(h=>h.object.parent?.userData.location||h.object.userData.location);const l=hit?.object.parent?.userData.location||hit?.object.userData.location;if(l){$('tip').classList.remove('hidden');$('tip').style.left=e.clientX+14+'px';$('tip').style.top=e.clientY+14+'px';$('tip').innerHTML=`<small>${l.category.toUpperCase()}</small><strong>${l.name}</strong><small>${l.district} · ★ ${l.rating}</small><em>${l.description}</em>`}else $('tip').classList.add('hidden')};
$('night').onclick=()=>{night=!night;scene.background.set(night?'#070b14':'#0b1113');scene.fog.color.set(night?'#070b14':'#0b1113');sun.color.set(night?'#5d739f':'#e1c08c');sun.intensity=night?.8:2.2;ambient.intensity=night?.6:1.2;$('night').classList.toggle('active',night)};
const heat=()=>{const counts=districts.map(d=>({...d,count:locations.filter(l=>l.district===d.name).length})).sort((a,b)=>b.count-a.count).slice(0,7);$('heatBars').innerHTML=counts.map(d=>`<div class="bar"><label><span>${d.name}</span><span>${d.count}</span></label><i><b style="width:${Math.max(7,d.count/Math.max(...counts.map(x=>x.count))*100)}%"></b></i></div>`).join('')};heat();$('heatToggle').onclick=()=>{$('heatBars').classList.toggle('hidden');$('heatToggle').textContent=$('heatBars').classList.contains('hidden')?'SHOW':'HIDE'};
for(const l of locations){$('origin').insertAdjacentHTML('beforeend',`<option value="${l.id}">${l.name}</option>`);$('destination').insertAdjacentHTML('beforeend',`<option value="${l.id}">${l.name}</option>`)}$('destination').value=locations[1].id;
$('draw').onclick=()=>{const a=locations.find(l=>l.id===$('origin').value),b=locations.find(l=>l.id===$('destination').value);if(!a||!b)return;const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a.x,.5,a.z),new THREE.Vector3((a.x+b.x)/2,1.4,(a.z+b.z)/2),new THREE.Vector3(b.x,.5,b.z)]),new THREE.LineBasicMaterial({color:'#dfb56a'}));line.name='active-route';city.getObjectByName('active-route')?.removeFromParent();city.add(line);$('routeLabel').textContent=`ROUTE / ${a.name} → ${b.name}`;$('routeLabel').classList.remove('hidden')};
$('detail').addEventListener('click',e=>{if(e.target.id==='routeSelected'){const a=locations[0],b=selected;$('origin').value=a.id;$('destination').value=b.id;$('draw').click()}});
function resize(){const w=$('map').clientWidth,h=$('map').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}window.onresize=resize;resize();function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
</script></body></html>
